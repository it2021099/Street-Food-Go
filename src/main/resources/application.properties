# Application
spring.application.name=StreetFoodGo

# Server
server.port=8080

# H2 Database (in-memory)
spring.datasource.url=jdbc:h2:mem:streetfoodgo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (secret must be base64 encoded, min 256 bits for HS256)
jwt.secret=c3RyZWV0Zm9vZGdvLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI1
jwt.expiration=86400000

# External Service: OSRM (Open Source Routing Machine) for delivery time calculation
# This is a black-box external service consumed via REST client
external.osrm.base-url=http://router.project-osrm.org
